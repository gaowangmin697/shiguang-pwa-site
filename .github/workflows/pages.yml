name: Publish Shiguang

on:
  push:
    branches: [main]
    paths: [shiguang-site.zip]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack static PWA
        run: mkdir -p site && unzip -q shiguang-site.zip -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish HTTPS site
        id: deployment
        uses: actions/deploy-pages@v4
